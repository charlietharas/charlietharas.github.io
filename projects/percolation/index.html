<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/stylesheet.css">
    <title>percolation</title>
</head>
<nav></nav>
<script src="/js/lightmode.js"></script>
<body>
    <div id="content">
        <h1 style="text-align:center">Percolation</h1>
        <p style="text-align:center"><a href="https://youtu.be/a-767WnbaCQ" target="_blank" class="blue">(inspo)</a>, <a href="https://youtu.be/iSxNP-1VpjE" target="_blank" class="blue">(percolator)</a></p>
    </div>
    <div style="text-align:center; margin:20px 0;">
        <label>P: <input type="range" id="paramP" value="0.5" min="0" max="1" step="0.005" style="width:300px; vertical-align:middle;"> <span id="paramPVal">0.50</span></label>
        <button id="toggleAuto" style="margin-left:20px; padding:5px 15px;">Pause</button>
    </div>
    <canvas id="sim" style="border:2px solid; margin-bottom:25px;">
        <script>
            var canvas = document.getElementById("sim");
            var c = canvas.getContext("2d", {willReadFrequently: true});
            canvas.width = window.innerWidth * 0.95;
            canvas.height = window.innerHeight * 0.8;

            function getParams() {
                return {
                    P: Math.max(0, Math.min(1, parseFloat(document.getElementById('paramP').value) || 0)),
                };
            }

            // compute cell grid
            let P = 0.5;
            let W = canvas.width;
            let H = canvas.height;
            let cellID = 1;
            let grid = new Uint32Array(W * H);
            let img = c.createImageData(W, H);
            let pixels = new Uint32Array(img.data.buffer);
            let clusterSizes = [];
            let colorCache = [];
            c.imageSmoothingEnabled = false;

            let queue = new Array(Math.max(W, H));
            let queueHead = 0;
            let queueTail = 0;

            function generateGrid() {
                grid.fill(0);
                clusterSizes.length = 0;
                cellID = 1;

                const WLocal = W;
                const HLocal = H;
                const gridLocal = grid;
                const PLocal = P;

                for (let j = 0; j < HLocal; j++) {
                    for (let i = 0; i < WLocal; i++) {
                        const startIdx = j * WLocal + i;
                        if (gridLocal[startIdx] !== 0) continue;

                        gridLocal[startIdx] = cellID;
                        let clusterSize = 1;
                        queueHead = 0;
                        queueTail = 0;
                        queue[queueTail++] = startIdx;

                        while (queueHead < queueTail) {
                            const cur = queue[queueHead++];
                            const x = cur % WLocal;
                            const y = (cur - x) / WLocal;

                            // right
                            if (x + 1 < WLocal) {
                                const ni = cur + 1;
                                if (gridLocal[ni] === 0 && Math.random() < PLocal) {
                                    gridLocal[ni] = cellID;
                                    queue[queueTail++] = ni;
                                    clusterSize++;
                                }
                            }
                            // left
                            if (x - 1 >= 0) {
                                const ni = cur - 1;
                                if (gridLocal[ni] === 0 && Math.random() < PLocal) {
                                    gridLocal[ni] = cellID;
                                    queue[queueTail++] = ni;
                                    clusterSize++;
                                }
                            }
                            // up
                            if (y - 1 >= 0) {
                                const ni = cur - WLocal;
                                if (gridLocal[ni] === 0 && Math.random() < PLocal) {
                                    gridLocal[ni] = cellID;
                                    queue[queueTail++] = ni;
                                    clusterSize++;
                                }
                            }
                            // down
                            if (y + 1 < HLocal) {
                                const ni = cur + WLocal;
                                if (gridLocal[ni] === 0 && Math.random() < PLocal) {
                                    gridLocal[ni] = cellID;
                                    queue[queueTail++] = ni;
                                    clusterSize++;
                                }
                            }
                        }
                        clusterSizes[cellID] = clusterSize;
                        cellID++;
                    }
                }
            }

            function hslToRgb(h, s, l) {
                h /= 360; s /= 100; l /= 100;
                const a = s * Math.min(l, 1 - l);
                function f(n){
                    const k = (n + h * 12) % 12;
                    const color = l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
                    return Math.round(255 * color);
                }
                return [f(0), f(8), f(4)];
            }

            function generateColorMapping() {
                if (colorCache.length < cellID) {
                    colorCache = new Array(cellID);
                }

                const sortedClusters = [];
                const clusterSizesLocal = clusterSizes;
                const cellIDLocal = cellID;

                for (let id = 1; id < cellIDLocal; id++) {
                    const size = clusterSizesLocal[id];
                    if (size > 0) {
                        sortedClusters.push({id: id, size: size});
                    }
                }
                sortedClusters.sort((a, b) => b.size - a.size);

                // AI color palette
                const topColors = generateColorMapping.topColors || (
                    generateColorMapping.topColors = [
                        {h: 210, s: 65, l: 42},
                        {h: 15, s: 70, l: 45},
                        {h: 120, s: 55, l: 35},
                        {h: 45, s: 75, l: 48},
                        {h: 270, s: 60, l: 40},
                        {h: 180, s: 65, l: 38},
                        {h: 25, s: 68, l: 50},
                        {h: 300, s: 58, l: 45},
                        {h: 90, s: 62, l: 40},
                        {h: 330, s: 65, l: 48}
                    ]
                );

                const topCount = Math.min(sortedClusters.length, topColors.length);
                const colorCacheLocal = colorCache;

                for (let i = 0; i < topCount; i++) {
                    const color = topColors[i];
                    const [r, g, b] = hslToRgb(color.h, color.s, color.l);
                    colorCacheLocal[sortedClusters[i].id] = (255 << 24) | (b << 16) | (g << 8) | r;
                }

                const golden = 137.50776405003785;
                for (let i = topCount; i < sortedClusters.length; i++) {
                    const cluster = sortedClusters[i];
                    const h = (cluster.id * golden) % 360;
                    const s = Math.min(30 + (cluster.size / 1000) * 15, 50);
                    const l = Math.min(35 + (cluster.size / 2000) * 12, 60);
                    const [r, g, b] = hslToRgb(h, s, l);
                    colorCacheLocal[cluster.id] = (255 << 24) | (b << 16) | (g << 8) | r;
                }

                colorCacheLocal[0] = 0;
            }

            function idToColor(id) {
                return colorCache[id] || 0;
            }

            // render
            function draw() {
                                for (let idx = 0; idx < grid.length; idx++) {
                    pixels[idx] = idToColor(grid[idx]);
                }
                c.putImageData(img, 0, 0);
            }

            function rerender() {
                const params = getParams();
                P = params.P;
                document.getElementById('paramPVal').textContent = P.toFixed(2);
                generateGrid();
                generateColorMapping();
                draw();
            }

            // rerender on slider update
            document.getElementById('paramP').addEventListener('input', rerender);

            // auto-bounce between 0 and 1 slowly
            let autoAnimate = true;
            let direction = 1;
            let lastTime = performance.now();
            let lastRenderAt = 0;
            const minRenderIntervalMs = 50; // throttle rerenders when bouncing
            const speedPerSecond = 0.08; // bounce speed

            function animate(t) {
                const dt = (t - lastTime) / 1000;
                lastTime = t;
                if (autoAnimate) {
                    let slider = document.getElementById('paramP');
                    let p = parseFloat(slider.value);
                    p += direction * speedPerSecond * dt;
                    if (p >= 1) { p = 1; direction = -1; }
                    if (p <= 0) { p = 0; direction = 1; }
                    slider.value = p.toFixed(3);
                    document.getElementById('paramPVal').textContent = parseFloat(slider.value).toFixed(2);
                    if (t - lastRenderAt > minRenderIntervalMs) {
                        lastRenderAt = t;
                        rerender();
                    }
                }
                requestAnimationFrame(animate);
            }

            document.getElementById('toggleAuto').addEventListener('click', function () {
                autoAnimate = !autoAnimate;
                this.textContent = autoAnimate ? 'Pause' : 'Resume';
            });

            rerender();
            requestAnimationFrame(animate);
        </script>
    </canvas>
</body>
</html>
