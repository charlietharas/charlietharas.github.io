<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WSO @ PKF</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: rgb(80, 0, 130);
        }

        .container {
            display: flex;
            height: 100vh;
            width: 80%;
            color:rgb(248, 248, 248);
            margin: 0 auto;
        }

        .column {
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        .scroll {
            position: absolute;
            width: 100%;
            height: auto;
            white-space: nowrap;
        }

        .scroll span {
            font-size: 36px;
            line-height: 48px;
            text-align: center;
            white-space: nowrap;
            display: block;
        }

        .scroll span.special-word {
            line-height: 1.1;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="column" id="column1"></div>
        <div class="column" id="column2"></div>
        <div class="column" id="column3"></div>
    </div>
    <script>
        async function readJSON() {
            const response = await fetch('/files/wso-words.json');
            if (!response.ok) {
                throw new Error('Failed to fetch wso-words.json: ' + response.statusText);
            }
            const data = await response.json();
            return data;
        }

        var pauses = [false, false, false];
        var doPauses = [false, false, false];
        const LINE_HEIGHT = 48;
        const SPECIAL_HEIGHT = 36 * 4.5 * 1.1 + 10; // 450% of 36px, line-height 1.1, + padding
        function getLayout() {
            const vh = window.innerHeight;
            const spansBefore = Math.max(2, Math.round((vh - SPECIAL_HEIGHT) / 2 / LINE_HEIGHT));
            const spansAfter = Math.max(4, Math.ceil((vh - SPECIAL_HEIGHT) / 2 / LINE_HEIGHT) + 4);
            return {
                contentAmt: spansBefore + 1 + spansAfter,
                specialIndex: spansBefore + 1 // arr[0] is the wrapping <div>
            };
        }
        function createScrollingContent(containerID, scrollSpeed, words, specialWord, index, layout) {
            const CONTENT_AMT = layout.contentAmt;
            const specialIndex = layout.specialIndex;
            const container = document.getElementById(containerID);
            const scrollDiv = document.createElement('div');
            scrollDiv.classList.add('scroll');

            function generateContent(num) {
                let arr = []
                arr.push('<div>');
                for (let i = 0; i < num; i++) {
                    arr.push(`<span>${words[Math.floor(Math.random() * words.length)].toLowerCase()}</span>`);
                }
                arr.push('</div>');
                arr[specialIndex] = '<span class="special-word" style="font-family:\'Georgia\', serif;padding:5px;color:rgb(80, 0, 130);background-color:rgb(255, 190, 10);font-size:450%;">' + specialWord + '</span>';
                if (index == 1) {
                    arr[specialIndex+1] = '<span style="font-family:\'Georgia\', serif;padding:5px;font-size:225%;line-height:1.2;"><u><b>' + 'tinyurl.com/wsopkf2026' + '</u></b></span>';
                    arr[specialIndex+2] = '<span style="color:rgb(80, 0, 130);">a</span>';
                }
                return arr.join('');
            }

            const initialContent = generateContent(CONTENT_AMT) + generateContent(CONTENT_AMT);
            scrollDiv.innerHTML = initialContent;
            container.appendChild(scrollDiv);

            let scrollHeight = scrollDiv.scrollHeight / 2;
            let offset = 0;

            function centerOffset() {
                const el = scrollDiv.querySelector('.special-word');
                if (!el) return 0;
                return Math.max(0, el.offsetTop + el.offsetHeight / 2 - window.innerHeight / 2);
            }

            function animateScroll() {
                if (!pauses[index]) {
                    offset += Math.abs(scrollSpeed);
                    
                    if (scrollHeight - offset <= scrollSpeed) {
                        pauses[index] = true;
                        scrollDiv.innerHTML = scrollDiv.innerHTML.replace(/^(<div>.*?<\/div>)/, '');
                        scrollDiv.innerHTML += generateContent(CONTENT_AMT);
                        scrollHeight = scrollDiv.scrollHeight / 2;
                        offset = centerOffset();
                    }

                    scrollDiv.style.top = `${-offset}px`;

                    requestAnimationFrame(animateScroll);

                } else {
                    if (pauses[0] && pauses[1] && pauses[2] && !doPauses[index]) {
                        doPauses[index] = true;
                        setTimeout(() => {
                            if (doPauses[index]) {
                                doPauses[index] = false;
                                pauses[index] = false;
                            }
                        }, 4000 + Math.floor(Math.random() * 1500));
                    }

                    requestAnimationFrame(animateScroll);
                }
            }

            animateScroll();
        }

        document.addEventListener('DOMContentLoaded', async (event) => {
            words_data = await readJSON();

            const layout = getLayout();
            createScrollingContent('column1', 4, words_data.w, 'WILLIAMS', 0, layout);
            createScrollingContent('column2', 3, words_data.s, 'STUDENTS', 1, layout);
            createScrollingContent('column3', 2, words_data.o, 'ONLINE', 2, layout);
        });
    </script>
</body>
</html>
